databaseChangeLog:
  - changeSet:
      id: 001-create-refresh-tokens
      author: nappleee
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_refresh_tokens
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: jti
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: revoked
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false

              - column:
                  name: revoked_at
                  type: DATETIME

        - addUniqueConstraint:
            tableName: refresh_tokens
            columnNames: jti
            constraintName: uk_refresh_tokens_jti

        - addUniqueConstraint:
            tableName: refresh_tokens
            columnNames: token_hash
            constraintName: uk_refresh_tokens_token_hash

        - addForeignKeyConstraint:
            baseTableName: refresh_tokens
            baseColumnNames: user_id
            constraintName: fk_refresh_tokens_user
            referencedTableName: users
            referencedColumnNames: user_id
            onDelete: CASCADE

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_expires_at
            columns:
              - column:
                  name: expires_at