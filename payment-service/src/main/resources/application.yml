server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/paymentservice?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:abcd}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  liquibase:
    enabled: false

services:
  order:
    url: ${ORDER_SERVICE_URL:http://order-service:8084}
  auth:
    url: ${AUTH_SERVICE_URL:http://auth-service:8088}
  product:
    url: ${PRODUCT_SERVICE_URL:http://product-service:8086}

  jwt:
    secret: ${JWT_SECRET:Zm9vLWJhci1iYXNlNjQtc2VjcmV0LWZvci1sb2NhbC1kZXYtMzIx}
    issuer: ${JWT_ISSUER:ecommerce-auth-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}

ecommerce:
  security:
    enabled: false