services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  mysql:
    image: mysql:8.4
    container_name: ecommerce-mysql
    environment:
      MYSQL_DATABASE: authservice
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ecommerce}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-ecommerce} -p${MYSQL_PASSWORD:-ecommerce} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ecommerce-network

  mysql-bootstrap:
    image: mysql:8.4
    container_name: ecommerce-mysql-bootstrap
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
    command:
      - sh
      - -ec
      - >-
        mysql -hmysql -uroot -p"$$MYSQL_ROOT_PASSWORD" -e
        "CREATE DATABASE IF NOT EXISTS authservice;
        CREATE DATABASE IF NOT EXISTS productservice;
        CREATE USER IF NOT EXISTS 'ecommerce'@'%' IDENTIFIED BY '$$MYSQL_PASSWORD';
        GRANT ALL PRIVILEGES ON authservice.* TO 'ecommerce'@'%';
        GRANT ALL PRIVILEGES ON productservice.* TO 'ecommerce'@'%';
        FLUSH PRIVILEGES;"
    networks:
      - ecommerce-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ecommerce-keycloak
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep '[k]eycloak' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network

  zipkin:
    image: openzipkin/zipkin:3
    container_name: ecommerce-zipkin
    ports:
      - "9411:9411"
    networks:
      - ecommerce-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ecommerce-api-gateway
    ports:
      - "8888:8888"
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ecommerce
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
    depends_on:
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ecommerce-auth-service
    ports:
      - "8088:8088"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ecommerce
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: ecommerce-product-service
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql_data: