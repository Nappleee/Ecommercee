services:
  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: authservice
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ecommerce}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_USER:-ecommerce} -p${MYSQL_PASSWORD:-ecommerce} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ecommerce-network

  mysql-bootstrap:
    image: mysql:8.4
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
    command:
      - sh
      - -ec
      - >-
        mysql -hmysql -uroot -p"$$MYSQL_ROOT_PASSWORD" -e
        "CREATE DATABASE IF NOT EXISTS authservice;
        CREATE DATABASE IF NOT EXISTS productservice;
        CREATE DATABASE IF NOT EXISTS orderservice;
        CREATE DATABASE IF NOT EXISTS inventoryservice;
        CREATE DATABASE IF NOT EXISTS paymentservice;
        CREATE DATABASE IF NOT EXISTS shippingservice;
        CREATE DATABASE IF NOT EXISTS promotionservice;
        CREATE USER IF NOT EXISTS 'ecommerce'@'%' IDENTIFIED BY '$$MYSQL_PASSWORD';
        CREATE DATABASE IF NOT EXISTS notificationservice;
        GRANT ALL PRIVILEGES ON notificationservice.* TO 'ecommerce'@'%';
        GRANT ALL PRIVILEGES ON authservice.* TO 'ecommerce'@'%';
        GRANT ALL PRIVILEGES ON productservice.* TO 'ecommerce'@'%';
        GRANT ALL PRIVILEGES ON orderservice.* TO 'ecommerce'@'%';
        GRANT ALL PRIVILEGES ON inventoryservice.* TO 'ecommerce'@'%';
        GRANT ALL PRIVILEGES ON paymentservice.* TO 'ecommerce'@'%';
        GRANT ALL PRIVILEGES ON shippingservice.* TO 'ecommerce'@'%';
        GRANT ALL PRIVILEGES ON promotionservice.* TO 'ecommerce'@'%';
        GRANT ALL PRIVILEGES ON notificationservice.* TO 'ecommerce'@'%';
        FLUSH PRIVILEGES;"
    networks:
      - ecommerce-network

  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"
    networks:
      - ecommerce-network
  kafka:
    image: apache/kafka:3.7.1
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - ecommerce-network
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8888:8888"
    depends_on:
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      promotion-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8088:8088"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: Zm9vLWJhci1iYXNlNjQtc2VjcmV0LWZvci1sb2NhbC1kZXYtMzIx
      JWT_ISSUER: ecommerce-auth-service
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: Zm9vLWJhci1iYXNlNjQtc2VjcmV0LWZvci1sb2NhbC1kZXYtMzIx
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: Zm9vLWJhci1iYXNlNjQtc2VjcmV0LWZvci1sb2NhbC1kZXYtMzIx
      JWT_ISSUER: ecommerce-auth-service
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network
  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: Zm9vLWJhci1iYXNlNjQtc2VjcmV0LWZvci1sb2NhbC1kZXYtMzIx
      JWT_ISSUER: ecommerce-auth-service
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: Zm9vLWJhci1iYXNlNjQtc2VjcmV0LWZvci1sb2NhbC1kZXYtMzIx
      JWT_ISSUER: ecommerce-auth-service
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      ORDER_SERVICE_URL: http://order-service:8084
      AUTH_SERVICE_URL: http://auth-service:8088
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully
      order-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network
  promotion-service:
    build:
      context: .
      dockerfile: promotion-service/Dockerfile
    container_name: ecommerce-promotion-service
    ports:
      - "8093:8093"
    environment:
      SERVER_PORT: 8093
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8093/promotion/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network
  shipping-service:
    build:
      context: .
      dockerfile: shipping-service/Dockerfile
    container_name: ecommerce-shipping-service
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: Zm9vLWJhci1iYXNlNjQtc2VjcmV0LWZvci1sb2NhbC1kZXYtMzIx
      JWT_ISSUER: ecommerce-auth-service
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ecommerce-notification-service
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-ecommerce}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      KAFKA_SERVERS: kafka:9092

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      ZIPKIN_URL: http://zipkin:9411
    depends_on:
      mysql:
        condition: service_healthy
      mysql-bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - ecommerce-network
  # ============================================================
  # FRONTEND — Next.js
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecommerce-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8888
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - ecommerce-network
networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql_data: