server:
  port: 8888
  shutdown: graceful
---
spring:
  application:
    name: API-GATEWAY
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      routes:
        # =====================
        # AUTH-SERVICE  :8088
        # =====================
        - id: auth-service-auth
          uri: http://auth-service:8088
          predicates:
            - Path=/api/v1/auth/**
        - id: auth-service-roles
          uri: http://auth-service:8088
          predicates:
            - Path=/api/v1/roles/**
        - id: auth-service-users
          uri: http://auth-service:8088
          predicates:
            - Path=/api/v1/users/**
        # =====================
        # PRODUCT-SERVICE  :8086
        # =====================
        - id: product-service-products
          uri: http://product-service:8086
          predicates:
            - Path=/api/products/**
        - id: product-service-categories
          uri: http://product-service:8086
          predicates:
            - Path=/api/categories/**
jwt:
  secret: ${JWT_SECRET:Zm9vLWJhci1iYXNlNjQtc2VjcmV0LWZvci1sb2NhbC1kZXYtMzIx}
---
security:
  public-paths:
    auth:
      - /api/v1/auth/signup
      - /api/v1/auth/register
      - /api/v1/auth/signin
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/refresh-token
      - /api/v1/auth/logout
      - /api/auth/signup
      - /api/auth/register
      - /api/auth/signin
      - /api/auth/refresh
      - /api/auth/logout
    storefront:
      - /api/products/**
      - /api/categories/**
      - /storefront/**
    swagger:
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /swagger-resources/**
      - /actuator/**
      - /error
      - /*/v3/api-docs/**
---